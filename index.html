<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Budget by MGM</title>
<meta name="theme-color" content="#2c5ccc">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget MGM">
<script>try{var t=JSON.parse(localStorage.getItem('budget:theme')||'{}');if(t.mode&&t.mode!=='auto')document.documentElement.setAttribute('data-theme',t.mode);if(t.accent&&t.accent!=='bleu')document.documentElement.setAttribute('data-accent',t.accent);}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Une colonne façon carnet de comptes : le "reste" en très gros en tête, puis un bloc coloré par catégorie. */
  --bg:#edf0f5; --surface:#ffffff; --ink:#1a2131; --muted:#5f6b80; --line:#d5dce7;
  --accent:#2c5ccc; --accent-soft:#e2eafb;
  --sub:#d9702a; --sub-soft:#fcebdd;
  --misc:#b8870f; --pink:#c2417f; --teal:#13817f; --violet:#6a4fcf;
  --good:#13805a; --good-soft:#dcf2e8; --bad:#c7344c; --bad-soft:#fbe2e6; --warn-soft:#fbf1d3;
  --font-display:"Bricolage Grotesque","Arial Rounded MT Bold",system-ui,sans-serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --on-accent:#ffffff;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f131b; --surface:#171d28; --ink:#e7ebf2; --muted:#9aa5b8; --line:#2a3343;
    --accent:#7ea3ff; --accent-soft:#1c2846;
    --sub:#f29a58; --sub-soft:#3a2517;
    --misc:#e6bb45; --pink:#f07ab2; --teal:#45c9c4; --violet:#a690ff;
    --good:#4fcb97; --good-soft:#123128; --bad:#ff7c90; --bad-soft:#3b1a22; --warn-soft:#342b11;
    color-scheme:dark;
    --on-accent:#0f131b;
  }
}
:root[data-theme="dark"]{
    --bg:#0f131b; --surface:#171d28; --ink:#e7ebf2; --muted:#9aa5b8; --line:#2a3343;
    --accent:#7ea3ff; --accent-soft:#1c2846;
    --sub:#f29a58; --sub-soft:#3a2517;
    --misc:#e6bb45; --pink:#f07ab2; --teal:#45c9c4; --violet:#a690ff;
    --good:#4fcb97; --good-soft:#123128; --bad:#ff7c90; --bad-soft:#3b1a22; --warn-soft:#342b11;
    color-scheme:dark;
  --on-accent:#0f131b;
}
:root[data-accent="vert"]{--accent:#13805a;--accent-soft:#dcf2e8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"])[data-accent="vert"]{--accent:#4fcb97;--accent-soft:#123128}}
:root[data-theme="dark"][data-accent="vert"]{--accent:#4fcb97;--accent-soft:#123128}
:root[data-accent="violet"]{--accent:#6a4fcf;--accent-soft:#ece7fb}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"])[data-accent="violet"]{--accent:#a690ff;--accent-soft:#261f45}}
:root[data-theme="dark"][data-accent="violet"]{--accent:#a690ff;--accent-soft:#261f45}
:root[data-accent="rose"]{--accent:#c2417f;--accent-soft:#fbe4ef}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"])[data-accent="rose"]{--accent:#f07ab2;--accent-soft:#3a1a2b}}
:root[data-theme="dark"][data-accent="rose"]{--accent:#f07ab2;--accent-soft:#3a1a2b}
:root[data-accent="orange"]{--accent:#c9601f;--accent-soft:#fcebdd}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"])[data-accent="orange"]{--accent:#f29a58;--accent-soft:#3a2517}}
:root[data-theme="dark"][data-accent="orange"]{--accent:#f29a58;--accent-soft:#3a2517}

*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--font-body);-webkit-text-size-adjust:100%;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 56px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;gap:12px}
.months{display:flex;align-items:center;gap:6px}
.months h1{font-size:21px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.months h1 small{font-size:15px;font-weight:600;color:var(--muted)}
.eyebrow{margin:0;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.icon-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1;display:grid;place-items:center;flex:none}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.hero{border-radius:22px;padding:20px 20px 18px;background:var(--good-soft);display:flex;flex-direction:column;gap:10px}
.hero.neg{background:var(--bad-soft)}
.hero-k{margin:0;font-weight:600;color:var(--muted);font-size:14px}
.big{margin:0;font-family:var(--font-display);font-weight:800;font-size:clamp(46px,15vw,78px);line-height:.95;letter-spacing:-.035em;color:var(--good)}
.hero.neg .big{color:var(--bad)}
.hero-sub{margin:0;font-size:14px}
.meter{height:10px;border-radius:999px;background:color-mix(in srgb,var(--ink) 10%,transparent);overflow:hidden}
.meter span{display:block;height:100%;border-radius:999px;background:var(--good);transition:width .4s ease}
.hero.neg .meter span,.meter span.over{background:var(--bad)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface);color:var(--muted);vertical-align:middle}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:var(--surface);border-radius:14px;padding:10px 12px;border-left:4px solid var(--c)}
.stat p{margin:0}
.stat .k{font-size:13px;color:var(--muted);font-weight:600}
.stat .v{font-family:var(--font-display);font-weight:700;font-size:20px}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;background:var(--accent);color:var(--on-accent)}
.btn.light{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.link{background:none;color:var(--accent);padding:11px 6px}
.btn:disabled{opacity:.5;cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.sec{background:var(--surface);border-radius:18px;padding:14px 16px 12px;border-top:5px solid var(--c);display:flex;flex-direction:column}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
.sec-h h2{font-size:18px;font-weight:700}
.sec-h .tot{font-family:var(--font-display);font-weight:700;font-size:17px}
.cols{display:flex;justify-content:flex-end;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.cols span{width:104px;text-align:right}
.row{display:flex;align-items:center;gap:8px;padding:5px 0;min-height:44px}
.lbl{flex:0 1 auto;min-width:0;overflow-wrap:anywhere}
.lbl small{display:block;color:var(--muted);font-size:13px}
.dots{flex:1 1 12px;min-width:12px;align-self:center;border-bottom:2px dotted var(--line);height:0;margin-top:6px}
.fixed-amt{flex:none;font-weight:600}
.cell{flex:none;width:104px;text-align:right;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;font-variant-numeric:tabular-nums;font-weight:600}
.cell::placeholder{color:var(--muted);font-weight:500;opacity:.8}
.cell:focus{background:var(--surface);border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.del{flex:none;width:32px;height:32px;border-radius:50%;border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1}
.del:hover{background:var(--bad-soft);color:var(--bad)}
.empty{margin:4px 0 8px;color:var(--muted);font-size:14px}
.add{display:flex;gap:8px;margin-top:8px;padding-top:10px;border-top:1px solid var(--line)}
.add input{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;min-width:0}
.add .n{flex:1}
.add .a{width:92px;text-align:right}
.add .btn{padding:9px 14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600}
.slip{margin-top:6px;font-size:13px;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.slip button{border:0;background:none;color:var(--accent);font-weight:700;padding:6px 0}
.note{font-size:13px;color:var(--muted);text-align:center;margin:6px 8px 0}
.warn{background:var(--warn-soft);border-radius:12px;padding:10px 12px;font-size:14px;margin:0}
.center{min-height:60vh;display:grid;place-items:center;text-align:center;color:var(--muted)}
.lock{background:var(--surface);border-radius:22px;padding:28px 20px 22px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;border:2px dashed var(--line)}
.lock h2{font-size:24px;font-weight:800}
.lock p{margin:0;max-width:40ch}
.lock-ic{width:68px;height:68px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.big-btn{font-size:17px;padding:14px 22px;width:100%;max-width:320px}
/* connexion */
.auth{display:flex;flex-direction:column;gap:16px;padding-top:6vh}
.auth h1{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1}
.auth h1 span{color:var(--accent)}
.auth .lead{margin:0;color:var(--muted);max-width:36ch}
.card{background:var(--surface);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card p{margin:0}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:14px;font-weight:600}
.field small{color:var(--muted);font-size:12px}
.field input{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-size:16px}
.msg{min-height:1.2em;font-size:14px;color:var(--bad);margin:0}
/* assistant de catégories */
.wz{display:flex;flex-direction:column;gap:14px}
.steps{display:flex;gap:6px}
.steps span{flex:1;height:5px;border-radius:999px;background:var(--line)}
.steps span.on{background:var(--accent)}
.wz-intro h1{font-size:28px;font-weight:800;letter-spacing:-.02em}
.wz-intro p{margin:6px 0 0;color:var(--muted)}
.grp{background:var(--surface);border-radius:18px;padding:14px 16px;border-top:5px solid var(--c);display:flex;flex-direction:column;gap:10px}
.grp h2{font-size:18px}
.grp .hint{margin:0;font-size:13px;color:var(--muted)}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.tog{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.tog[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--on-accent)}
.tog .ck{font-size:13px;opacity:.9}
.tog.req{cursor:default}
.custom{display:flex;gap:8px}
.custom input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px}
.custom button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:700}
.ed-row{display:flex;gap:8px;align-items:center;min-height:44px}
.ed-row label{flex:1;min-width:0}
.ed-row input{width:110px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;text-align:right;font-variant-numeric:tabular-nums}
.sticky{position:sticky;bottom:0;padding:10px 0 calc(6px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;gap:8px}
.sticky .btn{flex:1;padding:14px}
/* menu latéral */
.burger{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;color:var(--ink)}
.overlay.side{align-items:stretch;justify-content:flex-start}
.drawer{background:var(--surface);width:min(310px,86vw);height:100%;overflow:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:18px;box-shadow:8px 0 30px rgba(0,0,0,.18);animation:slidein .22s ease-out}
@keyframes slidein{from{transform:translateX(-100%)}to{transform:none}}
@media (prefers-reduced-motion: reduce){.drawer{animation:none}}
.drawer-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.drawer-h h2{font-size:22px;font-weight:800;letter-spacing:-.02em}
.drawer-h p{margin:2px 0 0;color:var(--muted);font-size:14px}
.dgrp{display:flex;flex-direction:column;gap:6px}
.dgrp h3{font-family:var(--font-body);font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:0 0 2px}
.ditem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:12px 10px;border-radius:12px;font-weight:600;font-size:16px}
.ditem:hover{background:var(--bg)}
.ditem svg{flex:none;color:var(--accent)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--bg);border-radius:12px;padding:4px}
.seg button{border:0;background:none;border-radius:9px;padding:9px 4px;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.swatches{display:flex;gap:10px;flex-wrap:wrap;padding:4px 2px}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--line);display:grid;place-items:center;color:#fff;font-size:16px}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--ink)}
/* pages qui glissent */
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px;scroll-padding:0 16px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;display:inline-flex;gap:6px;align-items:baseline;white-space:nowrap}
.tab small{font-weight:600;color:var(--muted);font-size:12px}
.tab[aria-selected="true"]{background:var(--c);border-color:var(--c);color:var(--on-accent)}
.tab[aria-selected="true"] small{color:inherit;opacity:.85}
.slider{overflow:hidden;margin:0 -16px;padding:0 16px;transition:height .25s ease;touch-action:pan-y}
.track{display:flex;gap:12px;align-items:flex-start;transition:transform .3s cubic-bezier(.2,.8,.2,1);will-change:transform}
.track.drag{transition:none}
.panel{flex:0 0 100%;min-width:0}
.dotsnav{display:flex;justify-content:center;gap:6px;margin-top:-4px}
.dotsnav span{width:6px;height:6px;border-radius:50%;background:var(--line);transition:width .2s}
.dotsnav span.on{width:18px;border-radius:999px;background:var(--ink)}
.swipe-hint{text-align:center;font-size:13px;color:var(--muted);margin:-6px 0 0}
/* relevé bancaire */
.bk-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bk-sum div{background:var(--bg);border-radius:12px;padding:8px 10px}
.bk-sum b{display:block;font-family:var(--font-display);font-size:22px}
.bk-sum span{font-size:12px;color:var(--muted);font-weight:600}
.bk-list{display:flex;flex-direction:column}
.bk-row{display:grid;grid-template-columns:28px 1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.bk-row:first-child{border-top:0}
.bk-row input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
.bk-row .l{min-width:0;overflow-wrap:anywhere;font-weight:600}
.bk-row .l small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.bk-row select{grid-column:2 / 4;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 8px;font:inherit;font-size:14px;color:var(--ink)}
.bk-ok{font-size:13px;color:var(--muted)}
.bk-ok summary{cursor:pointer;font-weight:700;color:var(--ink);padding:6px 0}
.bk-ok li{padding:3px 0}
/* bouton + flottant */
.fab{position:fixed;right:max(18px, env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:20px;border:0;background:var(--accent);color:var(--on-accent);box-shadow:0 8px 24px rgba(20,30,60,.28);display:grid;place-items:center;z-index:15}
.fab:active{transform:scale(.96)}
.wrap{padding-bottom:110px}
.perday{margin:0;font-size:12px;color:var(--muted)}
.qcats{display:flex;flex-wrap:wrap;gap:8px}
.qtext{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-size:16px;width:100%}
/* abonnements */
.abo-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);min-height:52px}
.abo-main{display:flex;align-items:center;gap:10px;border:0;background:none;flex:1;min-width:0;text-align:left;padding:0}
.abo-row.off .abo-main{opacity:.5}
.abo-row.off .abo-main b{text-decoration:line-through}
.abo-tog{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.abo-row.off .abo-tog{background:var(--sub);border-color:var(--sub);color:var(--on-accent)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.check input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin-top:1px}
.abo-row:first-of-type{border-top:0}
.abo-ic{width:36px;height:36px;border-radius:10px;background:var(--sub-soft);color:var(--sub);display:grid;place-items:center;font-weight:800;font-family:var(--font-display);flex:none}
.abo-row .l{flex:1;min-width:0;font-weight:600}
.abo-row .l small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.abo-row .soon{color:var(--sub);font-weight:700}
.abo-year{display:flex;justify-content:space-between;align-items:baseline;background:var(--sub-soft);border-radius:12px;padding:10px 12px;margin:4px 0 6px;font-size:14px}
.abo-year b{font-family:var(--font-display);font-size:20px}
/* recherche */
.sres{display:flex;flex-direction:column}
.sres button{display:flex;gap:10px;align-items:center;border:0;background:none;text-align:left;padding:10px 0;border-top:1px solid var(--line);width:100%}
.sres button:first-child{border-top:0}
.sres .l{flex:1;min-width:0;font-weight:600}
.sres .l small{display:block;color:var(--muted);font-weight:500;font-size:12px}
/* verrouillage */
#lock{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px}
#lock h2{font-size:24px;font-weight:800}
#lock p{margin:0;color:var(--muted);text-align:center}
.pdots{display:flex;gap:16px}
.pdots span{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink)}
.pdots span.on{background:var(--ink)}
.pdots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.keypad button{width:72px;height:72px;border-radius:50%;border:0;background:var(--surface);font-family:var(--font-display);font-size:28px;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.keypad button.ghostk{background:none;box-shadow:none;font-size:15px;font-family:var(--font-body);font-weight:600}
.bio-full{border:0;background:none;flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--ink)}
.bio-ic{width:96px;height:96px;border-radius:28px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.bio-t{font-family:var(--font-display);font-size:26px;font-weight:800}
.bio-s{color:var(--muted)}
#lock{animation:fadein .15s ease-out}
@keyframes fadein{from{opacity:.6}to{opacity:1}}
/* bandeau camembert */
.spend{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:16px;padding:10px 12px;border:0;width:100%;text-align:left}
.spend svg{flex:none}
.spend .lg{display:flex;gap:6px 12px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;flex-wrap:wrap;max-height:44px}
.spend .lg::-webkit-scrollbar{display:none}
.spend .it{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;white-space:nowrap}
.spend .it i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.spend .it b{color:var(--muted);font-weight:600}
.row.dep{cursor:pointer}
.row.dep:hover .lbl{color:var(--accent)}
/* objectifs */
.goal{border:0;background:none;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.goal:first-of-type{border-top:0}
.goal .t{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.goal .bar{height:9px;border-radius:999px;background:var(--bg);overflow:hidden}
.goal .bar span{display:block;height:100%;background:var(--good);border-radius:999px}
.goal small{color:var(--muted);font-size:12px}
/* bilan */
.big-q{font-family:var(--font-display);font-size:24px;font-weight:800;line-height:1.15;margin:0}
.kpi{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-top:1px solid var(--line)}
.kpi:first-child{border-top:0}
.kpi b{font-family:var(--font-display);font-size:18px}
/* compte à rebours paye */
.payday{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:16px;padding:10px 14px;border:0;width:100%;text-align:left}
.payday .emo{font-size:34px;line-height:1;flex:none}
.payday .emo.fire{animation:flame 1.2s ease-in-out infinite}
@keyframes flame{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.12) rotate(3deg)}}
@media (prefers-reduced-motion: reduce){.payday .emo.fire{animation:none}}
.payday b{font-family:var(--font-display);font-size:17px;display:block}
.payday small{color:var(--muted);font-size:13px}
/* suggestions */
.fb-item{border-top:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:6px}
.fb-item:first-child{border-top:0}
.fb-item p{margin:0}
.fb-item .who{font-size:12px;color:var(--muted)}
.fb-st{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--bg)}
.fb-st.a_faire{background:var(--accent-soft);color:var(--accent)}
.fb-st.fait{background:var(--good-soft);color:var(--good)}
.fb-st.refuse{background:var(--bad-soft);color:var(--bad)}
.fb-btns{display:flex;gap:6px;flex-wrap:wrap}
.fb-btns button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:700}
.fb-btns button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
textarea.qtext{min-height:110px;resize:vertical;font:inherit}
.badge{margin-left:auto;background:var(--bad);color:#fff;border-radius:999px;font-size:12px;font-weight:800;padding:1px 8px}
/* modale */
.overlay{position:fixed;inset:0;background:rgba(10,14,22,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
@media (min-width:600px){.overlay{align-items:center}.sheet{border-radius:22px}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet-h h2{font-size:21px}
.found{display:flex;align-items:center;gap:10px}
.found input{flex:1;font-family:var(--font-display);font-size:30px;font-weight:800;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 12px;text-align:right;min-width:0}
.meta{font-size:13px;color:var(--muted)}
.spinner{width:34px;height:34px;border-radius:50%;border:4px solid var(--accent-soft);border-top-color:var(--accent);animation:spin .9s linear infinite;margin:6px auto}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spinner{animation-duration:3s}.meter span{transition:none}}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);box-shadow:0 8px 24px rgba(0,0,0,.2);text-align:center;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

<script>window.__APP_VER__="2026.11.19-1724";</script>
<script>
(() => {
"use strict";
const APP_VER = window.__APP_VER__ || 'dev';
/* ---------- Supabase (même projet et mêmes comptes que l'appli de révision) ---------- */
const SUPA_URL = 'https://aychipxyiebtmknwskmb.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF5Y2hpcHh5aWVidG1rbndza21iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ5MTcxMTcsImV4cCI6MjExMDQ5MzExN30.DrSs5Rme7cNcltZ5StDnXoDT25g0mUgX-iF52t7R3D0';
const EMAIL_DOMAIN = '@bts-ndrc.app';

const app = document.getElementById('app');
const modalEl = document.getElementById('modal');
const fileEl = document.getElementById('file');
const EUR = new Intl.NumberFormat('fr-FR', {style: 'currency', currency: 'EUR'});
const fmt = n => EUR.format(Math.round((Number(n) || 0) * 100) / 100);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rid = () => Math.random().toString(36).slice(2, 10);
const clone = o => JSON.parse(JSON.stringify(o));
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function parseAmt(s){
  if (s == null) return null;
  s = String(s).replace(/[\s  €]/g, '').replace(',', '.');
  if (s === '') return null;
  const n = Number(s);
  return isFinite(n) ? Math.round(n * 100) / 100 : NaN;
}
const amtVal = n => (n == null ? '' : (Number.isInteger(n) ? String(n) : Number(n).toFixed(2).replace('.', ',')));
function monthKey(d){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function shiftKey(k, delta){ const [y, m] = k.split('-').map(Number); return monthKey(new Date(y, m - 1 + delta, 1)); }
function monthLabel(k, withYear = true){
  const [y, m] = k.split('-').map(Number);
  const s = new Date(y, m - 1, 1).toLocaleDateString('fr-FR', withYear ? {month: 'long', year: 'numeric'} : {month: 'long'});
  return s.charAt(0).toUpperCase() + s.slice(1);
}
const CUR = monthKey(new Date());
const LS = {
  get(k, d){ try { const v = localStorage.getItem('budget:' + k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { if (v == null) localStorage.removeItem('budget:' + k); else localStorage.setItem('budget:' + k, JSON.stringify(v)); } catch(e){} },
};

/* ---------- catalogue des catégories proposées ---------- */
const GROUPS = {
  entrees: {titre: 'Ce qui rentre', hint: 'Le salaire est obligatoire : c’est ton bulletin qui débloque chaque mois.', c: 'var(--accent)', items: [
    ['salaire','Salaire'],['aides','Aides (CAF, APL)'],['bourse','Bourse'],['prime','Prime d’activité'],['pension','Pension'],['extra','Petits boulots']]},
  fixes: {titre: 'Dépenses fixes', hint: 'Ce qui part tous les mois.', c: 'var(--ink)', items: [
    ['logement','Loyer / maison'],['nourriture','Nourriture'],['essence','Essence'],['epargne','Épargne'],['assurance','Assurances'],['electricite','Électricité / gaz'],['box','Box internet'],['telephone','Forfait téléphone'],['transport','Transports'],['credit','Crédit'],['mutuelle','Mutuelle']]},
  abos: {titre: 'Abonnements', hint: 'Streaming, jeux, sport…', c: 'var(--sub)', items: [
    ['netflix','Netflix'],['spotify','Spotify'],['deezer','Deezer'],['disney','Disney+'],['paramount','Paramount+'],['primevideo','Amazon Prime'],['canal','Canal+'],['youtube','YouTube Premium'],['psplus','PS Plus'],['gamepass','Game Pass'],['icloud','iCloud+'],['sport','Salle de sport']]},
  cats: {titre: 'Dépenses du mois', hint: 'Les catégories où tu notes tes dépenses au fil du mois.', c: 'var(--pink)', items: [
    ['sorties','Sorties (resto, bar…)'],['courses','Courses'],['shopping','Shopping'],['tabac','Tabac / vape'],['beaute','Coiffeur / beauté'],['loisirs','Loisirs'],['cadeaux','Cadeaux'],['sante','Santé'],['divers','Divers']]},
};
const CAT_COLORS = ['var(--pink)','var(--misc)','var(--teal)','var(--violet)','var(--sub)'];
const CAT_CHIPS = {
  sorties: ['Restaurant','Bar','Fast-food','Cinéma','Soirée','Concert'],
  courses: ['Supermarché','Boulangerie','Marché'],
  shopping: ['Vêtements','Chaussures','High-tech'],
  tabac: ['Tabac','Vape'],
  beaute: ['Coiffeur','Barbier','Soins'],
  loisirs: ['Jeux vidéo','Sport','Sortie'],
  sante: ['Pharmacie','Médecin'],
};

/* ---------- état ---------- */
const S = {
  user: null, view: 'loading',
  cfg: null, cfgLoaded: false,
  monKey: CUR, mon: null, monLoaded: false,
  err: null, offline: false, needRender: false, panel: null,
};

/* ---------- API ---------- */
async function api(path, opts = {}, token){
  const res = await fetch(SUPA_URL + path, {...opts, headers: {'apikey': SUPA_KEY, 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (token || SUPA_KEY), ...(opts.headers || {})}});
  const txt = await res.text(); let data = null; try { data = txt ? JSON.parse(txt) : null; } catch(e){}
  if (!res.ok){
    const err = new Error((data && (data.msg || data.message || data.error_description || data.error)) || ('Erreur ' + res.status));
    err.status = res.status; err.code = data && data.code; throw err;
  }
  return data;
}
async function session(){
  const u = LS.get('user', null); if (!u) return null;
  if (u.exp && Date.now() < u.exp - 60000) return u;
  try {
    const d = await api('/auth/v1/token?grant_type=refresh_token', {method: 'POST', body: JSON.stringify({refresh_token: u.refresh})});
    const nu = {...u, token: d.access_token, refresh: d.refresh_token, exp: Date.now() + d.expires_in * 1000};
    LS.set('user', nu); S.user = nu; return nu;
  } catch(e){
    if (e.status === 400 || e.status === 401){ logout(); return null; }
    throw e;
  }
}
function friendly(msg){
  const m = norm(msg);
  if (m.includes('already') || m.includes('duplicate') || m.includes('registered')) return 'Ce pseudo est déjà pris. Choisis-en un autre.';
  if (m.includes('invalid login') || m.includes('invalid credentials')) return 'E-mail ou mot de passe incorrect.';
  if (m.includes('password')) return 'Le mot de passe doit faire au moins 6 caractères.';
  if (m.includes('failed to fetch') || m.includes('network') || m.includes('load failed')) return 'Pas de connexion internet.';
  return msg;
}
function isMissingTable(e){ const m = norm(e && e.message); return e && (e.code === 'PGRST205' || e.code === '42P01' || m.includes('budget_docs')); }

const Docs = {
  cacheKey(key){ return 'doc:' + S.user.id + ':' + key; },
  pendingKey(key){ return 'pending:' + S.user.id + ':' + key; },
  touched: {}, writers: {},
  cached(key){ return LS.get(this.cacheKey(key), null); },
  async fetch(key){
    const u = await session(); if (!u) throw new Error('session');
    const rows = await api('/rest/v1/budget_docs?select=data&key=eq.' + encodeURIComponent(key), {}, u.token);
    return rows && rows[0] ? rows[0].data : null;
  },
  save(key, obj){
    LS.set(this.cacheKey(key), obj);
    LS.set(this.pendingKey(key), true);
    this.touched[key] = Date.now();
    const w = this.writers[key] || (this.writers[key] = {busy: false, next: null});
    w.next = clone(obj);
    if (!w.busy) this.flush(key);
  },
  async flush(key){
    const w = this.writers[key] || (this.writers[key] = {busy: false, next: null});
    if (w.busy) return;
    if (!w.next){ if (!LS.get(this.pendingKey(key), false)) return; w.next = this.cached(key); if (!w.next) return; }
    w.busy = true;
    try {
      while (w.next){
        const data = w.next; w.next = null;
        const u = await session(); if (!u) throw new Error('session');
        await api('/rest/v1/budget_docs?on_conflict=user_id,key', {method: 'POST', headers: {'Prefer': 'resolution=merge-duplicates,return=minimal'},
          body: JSON.stringify({user_id: u.id, key, data, updated_at: new Date().toISOString()})}, u.token);
      }
      LS.set(this.pendingKey(key), null);
      if (S.offline){ S.offline = false; render(); }
    } catch(e){
      if (isMissingTable(e)){ S.err = 'setup'; render(); }
      else if (!S.offline){ S.offline = true; toast('Hors ligne : enregistré sur ton téléphone, envoi dès que possible.'); render(); }
    } finally { w.busy = false; }
  },
  flushAll(){
    if (!S.user) return;
    for (let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i) || '';
      const pre = 'budget:pending:' + S.user.id + ':';
      if (k.startsWith(pre)) this.flush(k.slice(pre.length));
    }
  },
};
window.addEventListener('online', () => Docs.flushAll());
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.user){ Docs.flushAll(); } });

async function loadDoc(key, apply){
  const started = Date.now();
  const c = Docs.cached(key);
  if (c) apply(c, false);
  try {
    const d = await Docs.fetch(key);
    if ((Docs.touched[key] || 0) > started) return;
    if (LS.get(Docs.pendingKey(key), false)) { Docs.flush(key); return; }
    if (d) LS.set(Docs.cacheKey(key), d);
    apply(d, true);
  } catch(e){
    if (e.message === 'session') return;
    if (isMissingTable(e)){ S.err = 'setup'; render(); return; }
    S.offline = true;
    if (!c) apply(null, 'error');
    render();
  }
}
function loadCfg(){
  S.cfgLoaded = false;
  loadDoc('config', (d, ok) => {
    if (ok === 'error'){ S.err = 'load'; render(); return; }
    S.cfg = d ? upgradeCfg(d) : null; S.cfgLoaded = true;
    if (!S.cfg && S.view !== 'wizard') startWizard(null);
    render();
  });
}
function loadMon(){
  const key = S.monKey;
  S.mon = null; S.monLoaded = false;
  loadDoc('m-' + key, (d, ok) => {
    if (key !== S.monKey) return;
    if (ok === 'error'){ S.monLoaded = true; S.mon = null; }
    else { S.mon = d; S.monLoaded = true; }
    render();
  });
}
function upgradeCfg(c){
  c.entrees = c.entrees || []; c.fixes = c.fixes || []; c.abos = c.abos || []; c.cats = c.cats || [];
  if (!c.entrees.find(e => e.id === 'salaire')) c.entrees.unshift({id: 'salaire', nom: 'Salaire', prevu: 0});
  return c;
}

/* ---------- connexion ---------- */
function slug(p){ return norm(p).replace(/[^a-z0-9_.-]/g, ''); }
const SITE = 'https://budget-by-mgm.github.io/';
let AUTH_MODE = 'login'; // login | signup | forgot | newpass
let RECOVERY = null;
function saveSession(d, pseudo){
  const u = {pseudo, email: d.user && d.user.email, id: d.user.id, token: d.access_token, refresh: d.refresh_token, exp: Date.now() + (d.expires_in || 3600) * 1000};
  LS.set('user', u); S.user = u; afterLogin();
}
function nameFromEmail(e){ const n = String(e || '').split('@')[0]; return n.charAt(0).toUpperCase() + n.slice(1); }
function renderAuth(){
  const m = AUTH_MODE;
  const titles = {login: 'Me connecter', signup: 'Créer mon compte', forgot: 'Mot de passe oublié', newpass: 'Nouveau mot de passe'};
  app.innerHTML = `
    <section class="auth">
      <div><p class="eyebrow">Budget by MGM</p><h1>Ton budget,<br><span>dans ta poche.</span></h1></div>
      <p class="lead">${m === 'forgot' ? 'Tape ton adresse e-mail : tu vas recevoir un lien pour choisir un nouveau mot de passe.' : m === 'newpass' ? 'Choisis ton nouveau mot de passe.' : 'Connecte-toi pour retrouver ton budget sur tous tes appareils.'}</p>
      <form class="card" id="auth-form" autocomplete="on" novalidate>
        <h2 style="font-size:20px">${titles[m]}</h2>
        ${m !== 'newpass' ? `<div class="field"><label for="em">Adresse e-mail</label><input id="em" type="${m === 'login' ? 'text' : 'email'}" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false" placeholder="toi@exemple.fr">${m === 'login' ? '<small>Ancien compte avec un pseudo ? Tape ton pseudo ici.</small>' : ''}</div>` : ''}
        ${m !== 'forgot' ? `<div class="field"><label for="pw">${m === 'newpass' ? 'Nouveau mot de passe' : 'Mot de passe'}</label><input id="pw" type="password" autocomplete="${m === 'login' ? 'current-password' : 'new-password'}"><small>6 caractères minimum</small></div>` : ''}
        ${m === 'signup' || m === 'newpass' ? `<div class="field"><label for="pw2">Confirme le mot de passe</label><input id="pw2" type="password" autocomplete="new-password"></div>` : ''}
        <p class="msg" id="msg" role="status"></p>
        <button class="btn" type="submit" id="go">${titles[m]}</button>
        ${m === 'login' ? `<button class="btn link" type="button" data-auth="forgot" style="align-self:flex-start;padding:4px 0">Mot de passe oublié ?</button>` : ''}
      </form>
      ${m === 'login' ? `<button class="btn light" data-auth="signup">Pas encore de compte ? Créer mon compte</button>`
        : m === 'newpass' ? '' : `<button class="btn light" data-auth="login">J’ai déjà un compte : me connecter</button>`}
      <p class="note">Ton budget est privé : personne d’autre ne peut le voir.</p>
    </section>`;
  const $ = id => document.getElementById(id);
  const msg = (t, ok) => { const el = $('msg'); el.textContent = t; el.style.color = ok ? 'var(--good)' : ''; };
  app.querySelectorAll('[data-auth]').forEach(x => x.addEventListener('click', () => { AUTH_MODE = x.dataset.auth; const keep = $('em') && $('em').value; renderAuth(); if (keep && $('em')) $('em').value = keep; }));
  $('auth-form').addEventListener('submit', async e => {
    e.preventDefault();
    const go = $('go'); const busy = v => { go.disabled = v; };
    const raw = $('em') ? $('em').value.trim().toLowerCase() : '';
    const pw = $('pw') ? $('pw').value : '', pw2 = $('pw2') ? $('pw2').value : '';
    const isEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(raw);
    if (m !== 'newpass' && !raw) return msg('Tape ton adresse e-mail.');
    if ((m === 'signup' || m === 'forgot') && !isEmail) return msg('Cette adresse e-mail n’a pas l’air valide.');
    if (m !== 'forgot' && pw.length < 6) return msg('Le mot de passe doit faire au moins 6 caractères.');
    if ((m === 'signup' || m === 'newpass') && pw !== pw2) return msg('Les deux mots de passe ne sont pas pareils.');
    msg(''); busy(true);
    try {
      if (m === 'login'){
        let email = raw, legacy = false;
        if (!raw.includes('@')){ const sl = slug(raw); if (sl.length < 3){ busy(false); return msg('Tape ton adresse e-mail.'); } email = sl + EMAIL_DOMAIN; legacy = true; }
        const d = await api('/auth/v1/token?grant_type=password', {method: 'POST', body: JSON.stringify({email, password: pw})});
        let pseudo = legacy ? raw : nameFromEmail(email);
        if (legacy){ try { const rows = await api('/rest/v1/profiles?select=pseudo&id=eq.' + d.user.id, {}, d.access_token); if (rows && rows[0]) pseudo = rows[0].pseudo; } catch(e){} }
        else if (d.user && d.user.user_metadata && d.user.user_metadata.prenom) pseudo = d.user.user_metadata.prenom;
        saveSession(d, pseudo);
      } else if (m === 'signup'){
        const d = await api('/auth/v1/signup?redirect_to=' + encodeURIComponent(SITE), {method: 'POST', body: JSON.stringify({email: raw, password: pw, data: {prenom: nameFromEmail(raw)}})});
        if (d.access_token) saveSession(d, nameFromEmail(raw));
        else { busy(false); msg('Compte créé ! Ouvre l’e-mail qu’on vient de t’envoyer et clique sur le lien pour l’activer.', true); }
      } else if (m === 'forgot'){
        if (raw.endsWith(EMAIL_DOMAIN)){ busy(false); return msg('Les anciens comptes avec pseudo n’ont pas d’e-mail : crée un compte avec ton adresse.'); }
        await api('/auth/v1/recover?redirect_to=' + encodeURIComponent(SITE), {method: 'POST', body: JSON.stringify({email: raw})});
        busy(false); msg('C’est envoyé ! Regarde tes e-mails (et les spams) et clique sur le lien.', true);
      } else if (m === 'newpass'){
        const d = await api('/auth/v1/user', {method: 'PUT', body: JSON.stringify({password: pw})}, RECOVERY.access_token);
        AUTH_MODE = 'login';
        saveSession({...RECOVERY, user: d}, nameFromEmail(d.email));
        RECOVERY = null; toast('Mot de passe changé');
      }
    } catch(err){
      busy(false);
      const t = norm(err.message);
      if (t.includes('rate limit') || err.status === 429) msg('Trop d’e-mails envoyés d’un coup. Réessaie dans une heure.');
      else if (t.includes('not confirmed')) msg('Ton adresse n’est pas encore confirmée : clique sur le lien reçu par e-mail.');
      else msg(friendly(err.message).replace('Ce pseudo est déjà pris. Choisis-en un autre.', 'Un compte existe déjà avec cette adresse. Connecte-toi.'));
    }
  });
}
// Retour depuis un lien reçu par e-mail (confirmation ou mot de passe oublié)
function readAuthHash(){
  const h = location.hash.replace(/^#/, '');
  if (!/access_token=|error_description=/.test(h)) return;
  const q = new URLSearchParams(h);
  history.replaceState(null, '', location.pathname);
  if (q.get('error_description')){ AUTH_MODE = 'login'; setTimeout(() => toast('Le lien a expiré ou a déjà servi. Redemande-en un.'), 300); return; }
  const d = {access_token: q.get('access_token'), refresh_token: q.get('refresh_token'), expires_in: +q.get('expires_in') || 3600};
  if (q.get('type') === 'recovery'){ RECOVERY = d; AUTH_MODE = 'newpass'; LS.set('user', null); return; }
  return api('/auth/v1/user', {}, d.access_token).then(u => saveSession({...d, user: u}, (u.user_metadata && u.user_metadata.prenom) || nameFromEmail(u.email))).catch(() => {});
}

/* ---------- calculs ---------- */
function mon(){ const m = S.mon || {}; return {entrees: {}, fixesReel: {}, depenses: [], ...m}; }
function salaireReel(m){ return (m.entrees || {}).salaire ?? null; }
function totals(){
  const c = S.cfg, m = mon();
  let estime = false;
  const entrees = c.entrees.reduce((s, e) => { const r = m.entrees[e.id]; if (r == null) estime = true; return s + (r ?? e.prevu ?? 0); }, 0);
  const fixes = c.fixes.reduce((s, f) => s + (m.fixesReel[f.id] ?? f.prevu ?? 0), 0);
  const abos = c.abos.filter(a => aboActive(a, m)).reduce((s, a) => s + (a.montant || 0), 0);
  const catIds = new Set(c.cats.map(k => k.id));
  const depenses = (m.depenses || []).filter(d => catIds.has(d.cat)).reduce((s, d) => s + (d.montant || 0), 0);
  const dispo = entrees - fixes - abos;
  return {entrees, estime, fixes, abos, depenses, dispo, reste: dispo - depenses};
}

/* ---------- abonnements intelligents ---------- */
function nextDebit(jour){
  if (!jour) return null;
  const n = new Date(); n.setHours(0, 0, 0, 0);
  const mk = (y, m) => new Date(y, m, Math.min(jour, new Date(y, m + 1, 0).getDate()));
  let d = mk(n.getFullYear(), n.getMonth());
  if (d < n) d = mk(n.getFullYear(), n.getMonth() + 1);
  return Math.round((d - n) / 864e5);
}
function aboActive(a, m){
  m = m || mon();
  if (a.occasionnel) return (m.abosOn || []).includes(a.id);
  return !(m.abosPause || []).includes(a.id);
}
function aboCard(c, t){
  if (!c.abos.length) return `<section class="sec" style="--c:var(--sub)"><div class="sec-h"><h2>Abonnements</h2></div><p class="empty">Aucun abonnement. <button class="btn link" style="padding:0" data-act="edit-cats">En ajouter</button></p></section>`;
  const m = mon(), mois = monthLabel(S.monKey, false).toLowerCase();
  const list = c.abos.map(a => ({...a, on: aboActive(a, m), dans: nextDebit(a.jour)})).sort((x, y) => (y.on - x.on) || ((x.dans ?? 99) - (y.dans ?? 99)));
  const when = a => {
    if (!a.on) return a.occasionnel ? 'Pas tous les mois · pas pris en ' + esc(mois) : 'En pause en ' + esc(mois);
    const d = a.dans, lab = a.occasionnel ? 'Pris en ' + esc(mois) + ' · ' : '';
    if (S.monKey !== CUR) return lab + (a.jour ? 'Le ' + a.jour + ' du mois' : 'Actif');
    return lab + (d == null ? 'Touche pour ajouter le jour du prélèvement' : (a.jour ? 'Le ' + a.jour + ' · ' : '') + (d === 0 ? '<span class="soon">Prélevé aujourd’hui</span>' : d === 1 ? '<span class="soon">Prélevé demain</span>' : d <= 5 ? `<span class="soon">Prélevé dans ${d} jours</span>` : `Prélevé dans ${d} jours`));
  };
  const yearly = c.abos.filter(a => !a.occasionnel).reduce((s2, a) => s2 + (a.montant || 0), 0) * 12;
  const occ = c.abos.filter(a => a.occasionnel).length;
  return `
    <section class="sec" style="--c:var(--sub)" aria-labelledby="h-abo">
      <div class="sec-h"><h2 id="h-abo">Abonnements</h2><span class="tot num">${fmt(t.abos)}<small style="font-size:12px;color:var(--muted)"> en ${esc(mois)}</small></span></div>
      <div class="abo-year"><span>Sur un an, tes abonnements te coûtent${occ ? ' (sans ceux pris de temps en temps)' : ''}</span><b class="num">${fmt(yearly)}</b></div>
      ${list.map(a => `
        <div class="abo-row${a.on ? '' : ' off'}">
          <button class="abo-main" data-act="abo-edit" data-id="${esc(a.id)}">

/* ---------- bandeau : où part ton argent ---------- */
function spendBand(c, m, t){
  const parts = [];
  if (t.fixes > 0) parts.push({id: 'fixes', nom: 'Fixes', v: t.fixes, col: 'var(--muted)'});
  if (t.abos > 0) parts.push({id: 'abos', nom: 'Abonnements', v: t.abos, col: 'var(--sub)'});
  c.cats.forEach((k, i) => { const v = (m.depenses || []).filter(d => d.cat === k.id).reduce((s, d) => s + (d.montant || 0), 0); if (v > 0) parts.push({id: 'c-' + k.id, nom: k.nom, v, col: CAT_COLORS[i % CAT_COLORS.length]}); });
  const tot = parts.reduce((s, p) => s + p.v, 0);
  if (!tot) return '';
  const R = 22, C = 2 * Math.PI * R; let off = 0;
  const arcs = parts.map(p => { const len = p.v / tot * C; const a = `<circle r="${R}" cx="30" cy="30" fill="none" stroke="${p.col}" stroke-width="10" stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 30 30)"/>`; off += len; return a; }).join('');
  return `<button class="spend" data-act="spend-detail" aria-label="Où part ton argent ce mois-ci">
    <svg width="60" height="60" viewBox="0 0 60 60" aria-hidden="true">${arcs}</svg>
    <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px"><span style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em">Où part ton argent · ${fmt(tot)}</span>
    <span class="lg">${parts.sort((a, b) => b.v - a.v).map(p => `<span class="it" style="--c:${p.col}"><i></i>${esc(p.nom)} <b>${Math.round(p.v / tot * 100)} %</b></span>`).join('')}</span></span>
  </button>`;
}
function spendDetail(){
  const c = S.cfg, m = mon(), t = totals();
  const rows = [];
  if (t.fixes > 0) rows.push(['Dépenses fixes', t.fixes, 'var(--muted)']);
  if (t.abos > 0) rows.push(['Abonnements', t.abos, 'var(--sub)']);
  c.cats.forEach((k, i) => { const v = (m.depenses || []).filter(d => d.cat === k.id).reduce((s, d) => s + (d.montant || 0), 0); rows.push([k.nom, v, CAT_COLORS[i % CAT_COLORS.length]]); });
  const tot = rows.reduce((s, r) => s + r[1], 0) || 1;
  openModal(`
    <div class="sheet-h"><h2>Où part ton argent</h2><button class="icon-btn" data-act="close" aria-label="Fermer">×</button></div>
    <div class="card">${rows.sort((a, b) => b[1] - a[1]).map(([n, v, col]) => `
      <div class="goal" style="padding:8px 0"><div class="t"><span>${esc(n)}</span><span class="num">${fmt(v)} · ${Math.round(v / tot * 100)} %</span></div>
      <div class="bar"><span style="width:${Math.round(v / tot * 100)}%;background:${col}"></span></div></div>`).join('')}</div>`);
}

/* ---------- bilan de fin de mois ---------- */
let BILAN = null;
function bilanTarget(){
  const n = new Date(), last = new Date(n.getFullYear(), n.getMonth() + 1, 0).getDate();
  if (n.getDate() >= last - 2) return CUR;
  if (n.getDate() <= 7) return shiftKey(CUR, -1);
  return null;
}
function maybeBilan(){
  if (BILAN || locked || modalEl.innerHTML || S.view !== 'main' || !S.cfg || !S.monLoaded) return;
  const k = bilanTarget(); if (!k || S.monKey !== k) return;
  const m = mon(); if (salaireReel(m) == null || m.bilan) return;
  const flag = 'bilan-vu:' + S.user.id + ':' + k; if (LS.get(flag, false)) return;
  LS.set(flag, true);
  setTimeout(() => openBilan(), 500);
}
function openBilan(){
  const t = totals();
  BILAN = {step: 1, key: S.monKey, prevu: t.reste};

}

  const head = `<div class="sheet-h"><h2>Bilan de ${esc(mois)}</h2><button class="icon-btn" data-act="bilan-close" aria-label="Fermer">×</button></div>

  if (b.step === 1){

      <button class="btn" type="submit">Continuer</button>
      <button class="btn link" type="button" data-act="bilan-skip">Passer</button></form>`);
  } else if (b.step === 3){
    const gs = S.cfg.objectifs || [];
    const ecart = b.reel != null ? b.reel - b.prevu : null;
    openModal(head + `<div class="card">
      ${ecart != null && Math.abs(ecart) >= 5 ? (ecart < 0
        ? `<p class="warn">Il te reste <b>${fmt(-ecart)}</b> de moins que prévu : il y a sûrement des dépenses que tu n’as pas notées.</p><button class="btn light" data-act="bilan-releve">Les retrouver avec mon relevé</button>`
        : `<p class="warn" style="background:var(--good-soft)">Il te reste <b>${fmt(ecart)}</b> de plus que prévu. Bien joué, ou une rentrée d’argent pas notée !</p>`)
        : (ecart != null ? `<p class="warn" style="background:var(--good-soft)">Ton budget colle à ton compte, à quelques euros près. 👌</p>` : '')}
      ${(b.pos === 'oui' && (b.reel ?? b.prevu) > 0) ? (gs.length ? `
        <p class="big-q">Tu mets une partie de côté ?</p>
        <form id="bilan-save" style="display:flex;flex-direction:column;gap:10px">
          <select id="bi-goal" class="qtext">${gs.map(g => `<option value="${esc(g.id)}">${esc(g.nom)} (${fmt(g.deja || 0)} / ${fmt(g.cible)})</option>`).join('')}</select>
          <div class="found"><input id="bi-amt" inputmode="decimal" placeholder="${esc(amtVal(Math.max(0, Math.floor((b.reel ?? b.prevu) / 2))))}" aria-label="Montant à mettre de côté"><strong>€</strong></div>

      ${b.pos === 'non' ? `<p>Pas grave, ça arrive. Le mois prochain, regarde le « reste par jour » sous le gros chiffre : c’est le plus simple pour ne pas dépasser.</p>` : ''}
      <button class="btn${b.pos === 'oui' && gs.length ? ' link' : ''}" data-act="bilan-next">Voir mon résumé</button></div>`);
  } else {
    const all = await loadAllMonths().catch(() => ({}));
    const m = all[b.key] || mon(), prev = all[shiftKey(b.key, -1)];
    const sumCat = (mm, id) => ((mm && mm.depenses) || []).filter(d => d.cat === id).reduce((s, d) => s + (d.montant || 0), 0);

    const totM = cats.reduce((s, x) => s + x.v, 0), totP = prev ? cats.reduce((s, x) => s + (x.p || 0), 0) : null;
    const top = cats[0], up = cats.filter(x => x.p != null && x.v - x.p >= 15).sort((a, c) => (c.v - c.p) - (a.v - a.p))[0];
    const nbDep = ((m && m.depenses) || []).length;
    openModal(head + `<div class="card">

        ${totP != null ? `<div class="kpi"><span>Par rapport à ${esc(monthLabel(shiftKey(b.key, -1), false).toLowerCase())}</span><b class="num" style="color:${totM > totP ? 'var(--bad)' : 'var(--good)'}">${totM > totP ? '+' : '−'} ${fmt(Math.abs(totM - totP))}</b></div>` : ''}
        ${top ? `<div class="kpi"><span>Là où tu as le plus dépensé</span><b>${esc(top.k.nom)}</b></div>` : ''}
      </div>
      ${up ? `<p class="warn">${esc(up.k.nom)} : <b>+ ${fmt(up.v - up.p)}</b> par rapport au mois d’avant.</p>` : ''}
      <button class="btn" data-act="bilan-done">Terminer</button></div>`);
  }
}

  const same = (mon().depenses || []).slice().reverse().find(d => (stemKey(d.nom) || norm(d.nom)) === k);

}

    if (u){ const rows = await api('/rest/v1/budget_docs?select=key,data&key=like.m-*', {}, u.token); (rows || []).forEach(r => { const k = r.key.slice(2); if (!LS.get(Docs.pendingKey(r.key), false)) out[k] = r.data; }); }

}

/* ---------- verrouillage : code + Face ID / empreinte ---------- */
const lockEl = document.getElementById('lock');
let PIN = null, locked = false, hiddenAt = 0, tries = 0, waitUntil = 0;
const lockKey = () => 'lock:' + (S.user && S.user.id);
const lockCfg = () => S.user ? LS.get(lockKey(), null) : null;
async function hashPin(salt, pin){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + pin));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64 = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4)), c => c.charCodeAt(0));
async function bioAvailable(){ try { return !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); } catch(e){ return false; } }
async function bioCheck(){
  const lc = lockCfg(); if (!lc || !lc.bio) return false;
  try {
    await navigator.credentials.get({publicKey: {challenge: crypto.getRandomValues(new Uint8Array(32)), allowCredentials: [{type: 'public-key', id: unb64(lc.bio)}], userVerification: 'required', timeout: 60000, rpId: location.hostname}});
    return true;
  } catch(e){ return false; }
}
function keypad(extraLeft){
  return `<div class="keypad">${[1,2,3,4,5,6,7,8,9].map(n => `<button data-act="pin" data-v="${n}">${n}</button>`).join('')}${extraLeft || '<span></span>'}<button data-act="pin" data-v="0">0</button><button class="ghostk" data-act="pin-del" aria-label="Effacer">⌫</button></div>`;
}
let LOCK_PAD = false;
function drawLock(msg){
  const lc = lockCfg();
  if (lc && lc.bio && !LOCK_PAD){
    lockEl.innerHTML = `
      <button class="bio-full" data-act="bio" aria-label="Déverrouiller avec Face ID">
        <span class="bio-ic"><svg viewBox="0 0 24 24" width="54" height="54" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M9 9v1M15 9v1M12 9v4h-1M9.5 16a3.5 3.5 0 0 0 5 0"/></svg></span>
        <span class="bio-t">Budget by MGM</span>
        <span class="bio-s">${esc(msg || 'Touche l’écran pour déverrouiller')}</span>
      </button>
      <button class="btn link" data-act="lock-pad">Utiliser mon code</button>`;
    return;
  }
  lockEl.innerHTML = `
    <h2>Budget by MGM</h2>
    <p>${esc(msg || 'Tape ton code')}</p>
    <div class="pdots" id="pdots">${[0,1,2,3].map(i => `<span class="${i < PIN.length ? 'on' : ''}"></span>`).join('')}</div>
    ${keypad(lc && lc.bio ? '<button class="ghostk" data-act="bio">Face ID</button>' : '')}
    <button class="btn link" data-act="lock-forgot">Code oublié ? Se reconnecter</button>`;
}
function lockNow(){
  if (!lockCfg()) return;
  locked = true; PIN = ''; LOCK_PAD = false; lockEl.hidden = false; app.setAttribute('aria-hidden', 'true'); drawLock();
  const lc = lockCfg(); if (lc.bio) setTimeout(async () => { if (locked && await bioCheck()) unlock(); }, 150); // Android : se lance tout seul
}
function unlock(){ locked = false; tries = 0; lockEl.hidden = true; lockEl.innerHTML = ''; app.removeAttribute('aria-hidden'); }
async function pinTyped(){
  if (PIN.length < 4) return;
  const lc = lockCfg();
  if (Date.now() < waitUntil){ PIN = ''; drawLock('Trop d’essais. Attends quelques secondes.'); return; }
  if (await hashPin(lc.salt, PIN) === lc.hash){ unlock(); return; }
  tries++; PIN = '';
  if (tries >= 5){ waitUntil = Date.now() + 30000; tries = 0; drawLock('Trop d’essais. Réessaie dans 30 secondes.'); }
  else drawLock('Code incorrect');
  const d = document.getElementById('pdots'); if (d) d.classList.add('shake');
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') hiddenAt = Date.now();
  else if (hiddenAt && Date.now() - hiddenAt > 60000 && S.user && lockCfg() && !locked) lockNow();
});
// réglage du code
let SETPIN = null;
async function openLockSettings(){
  const lc = lockCfg(), bio = await bioAvailable();
  if (!lc){ SETPIN = {step: 1, first: '', cur: ''}; drawSetPin(); return; }
  openModal(`
    <div class="sheet-h"><h2>Verrouillage</h2><button class="icon-btn" data-act="close" aria-label="Fermer">×</button></div>

      <button class="btn light" data-act="pin-change">Changer le code</button>
      <button class="btn light" data-act="pin-off">Désactiver le verrouillage</button>

}
function drawSetPin(msg){
  openModal(`
    <div class="sheet-h"><h2>${SETPIN.step === 1 ? 'Choisis un code' : 'Confirme ton code'}</h2><button class="icon-btn" data-act="close" aria-label="Fermer">×</button></div>
    <div class="card" style="align-items:center;gap:18px">

}
async function setPinTyped(){
  if (SETPIN.cur.length < 4) return;
  if (SETPIN.step === 1){ SETPIN = {step: 2, first: SETPIN.cur, cur: ''}; drawSetPin(); return; }
  if (SETPIN.cur !== SETPIN.first){ SETPIN = {step: 1, first: '', cur: ''}; drawSetPin('Les deux codes ne sont pas pareils. Recommence.'); return; }
  const salt = b64(crypto.getRandomValues(new Uint8Array(16)));
  const old = lockCfg();
  LS.set(lockKey(), {salt, hash: await hashPin(salt, SETPIN.first), bio: old && old.bio || null});
  SETPIN = null;
  if (!old && await bioAvailable()){
    openModal(`
      <div class="sheet-h"><h2>Code enregistré</h2><button class="icon-btn" data-act="close" aria-label="Fermer">×</button></div>
      <div class="card"><p>Tu veux aussi pouvoir déverrouiller avec <b>Face ID ou ton empreinte</b> ?</p>
      <button class="btn" data-act="bio-toggle">Oui, activer</button><button class="btn light" data-act="close">Non, juste le code</button></div>`);
  } else { closeModal(); toast('Code enregistré'); }
}
async function bioToggle(){
  const lc = lockCfg(); if (!lc) return;
  if (lc.bio){ lc.bio = null; LS.set(lockKey(), lc); closeModal(); toast('Face ID / empreinte désactivé'); return; }
  try {
    const cred = await navigator.credentials.create({publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      rp: {name: 'Budget by MGM', id: location.hostname},
      user: {id: new TextEncoder().encode(S.user.id).slice(0, 64), name: S.user.pseudo, displayName: S.user.pseudo},
      pubKeyCredParams: [{type: 'public-key', alg: -7}, {type: 'public-key', alg: -257}],
      authenticatorSelection: {authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged'},
      timeout: 60000}});
    lc.bio = b64(cred.rawId); LS.set(lockKey(), lc); closeModal(); toast('Face ID / empreinte activé');
  } catch(e){ toast('Pas réussi à activer Face ID / empreinte sur cet appareil.'); }
}

function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('script')); document.head.appendChild(s); }); }
let pdfjsP = null, tessP = null;
let pendingReload = null;
function getPdfjs(){
  if (!pdfjsP){
    const base = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
    pdfjsP = (async () => {
      await loadScript(base + 'pdf.worker.min.js');
      await loadScript(base + 'pdf.min.js');
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = base + 'pdf.worker.min.js';
      return window.pdfjsLib;
    })();
    pdfjsP.catch(() => { pdfjsP = null; });
  }
  return pdfjsP;
}
function getTesseract(){
  if (!tessP){ tessP = loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js').then(() => window.Tesseract); tessP.catch(() => { tessP = null; }); }
  return tessP;
}
async function ocr(canvas, onProg){
  const T = await getTesseract();
  const worker = await T.createWorker('fra', 1, {logger: m => { if (m.status === 'recognizing text' && onProg) onProg(Math.round(m.progress * 100)); }});
  try { const r = await worker.recognize(canvas); return r.data.text || ''; }
  finally { worker.terminate(); }
}
async function imageCanvas(file){
  let img;
  try { img = await createImageBitmap(file, {imageOrientation: 'from-image'}); }
  catch(e){ img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); }); }
  const k = Math.min(1, 2200 / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
  return c;
}
async function pdfText(file, onStatus){
  const lib = await getPdfjs();
  const pdf = await lib.getDocument({data: await file.arrayBuffer(), isEvalSupported: false}).promise;
  let text = '';
  for (let p = 1; p <= Math.min(pdf.numPages, 2); p++){
    const page = await pdf.getPage(p);
    const tc = await page.getTextContent();
    const rows = [];
    tc.items.forEach(it => {
      if (!it.str || !it.str.trim()) return;
      const y = it.transform[5], x = it.transform[4];
      let r = rows.find(r => Math.abs(r.y - y) < 3);
      if (!r){ r = {y, parts: []}; rows.push(r); }
      r.parts.push({x, s: it.str});
    });
    rows.sort((a, b) => b.y - a.y);
    text += rows.map(r => r.parts.sort((a, b) => a.x - b.x).map(p => p.s).join(' ')).join('\n') + '\n';
  }
  if (text.replace(/\s/g, '').length > 80) return text;
  // PDF scanné : on lit l'image de la 1re page
  onStatus && onStatus('Lecture de l’image du PDF…');
  const page = await pdf.getPage(1);
  const v1 = page.getViewport({scale: 1});
  const vp = page.getViewport({scale: Math.min(3, 2200 / Math.max(v1.width, v1.height))});
  const c = document.createElement('canvas'); c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  await page.render({canvasContext: ctx, viewport: vp}).promise;
  return ocr(c);
}

  const amounts = l => [...l.matchAll(AMT)].map(m => parseFloat(m[1].replace(/[ .  ]/g, '') + '.' + m[2]));
  let best = null;
  lines.forEach((l, i) => {

    if (/apres (impot|prelevement|pas)|net paye|net verse|au salarie/.test(t)) score = 5;
    if (!score) return;
    let a = amounts(l).filter(v => v > 0 && v < 100000);
    if (!a.length && lines[i + 1]) a = amounts(lines[i + 1]).filter(v => v > 0 && v < 100000);
    if (!a.length) return;
    const v = a[a.length - 1];
    if (!best || score > best.score || (score === best.score && i > best.i)) best = {score, v, line: l, i};
  });
  const tt = norm(text);
  let periode = null;
  let m = tt.match(/du\s*\d{1,2}[\/.]\d{2}[\/.]\d{4}\s*au\s*\d{1,2}[\/.](\d{2})[\/.](\d{4})/);
  if (m) periode = m[2] + '-' + m[1];
  else { m = tt.match(new RegExp('(' + MOIS.join('|') + ')\\s+(20\\d{2})')); if (m) periode = m[2] + '-' + String(MOIS.indexOf(m[1]) + 1).padStart(2, '0'); }
  return {net: best ? best.v : null, ligne: best ? best.line.slice(0, 90) : null, periode};
}
function slipConfirm(res, msg){
  const net = res && typeof res.net === 'number' ? res.net : null;
  const meta = [];
  if (res && res.ligne) meta.push('Ligne lue : « ' + esc(res.ligne) + ' »');
  if (res && res.periode) meta.push('Période : ' + esc(monthLabel(res.periode).toLowerCase()));
  openModal(`
    <div class="sheet-h"><h2>${net != null ? 'Salaire trouvé' : 'Ton salaire du mois'}</h2><button class="icon-btn" data-act="close" aria-label="Fermer">×</button></div>
    <div class="card">
      ${msg ? `<p class="warn">${esc(msg)}</p>` : ''}
      <p>${net != null ? 'Vérifie le net versé, corrige-le si besoin :' : 'Indique le net versé sur ton compte :'}</p>
      <div class="found"><input id="slip-amt" inputmode="decimal" value="${esc(amtVal(net))}" placeholder="0,00" aria-label="Salaire net versé"><strong>€</strong></div>
      ${meta.length ? `<p class="meta">${meta.join(' · ')}</p>` : ''}
    </div>
    <p class="msg" id="slip-err" role="status"></p>
    <div class="actions"><button class="btn" data-act="slip-ok" data-periode="${esc(res && res.periode || '')}" data-read="${net != null ? '1' : ''}" style="flex:1">Valider pour ${esc(monthLabel(S.monKey, false).toLowerCase())}</button><button class="btn light" data-act="close">Annuler</button></div>`);
}
async function readSlip(file){
  const setStatus = t => { const el = document.getElementById('slip-status'); if (el) el.textContent = t; };
  openModal(`<div class="card" style="text-align:center"><div class="spinner" aria-hidden="true"></div><p><strong>Lecture du bulletin…</strong></p><p class="meta" id="slip-status">Quelques secondes.</p></div>`);
  try {
    const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
    let text;
    if (isPdf) text = await pdfText(file, setStatus);
    else { setStatus('Lecture de la photo… (la première fois peut prendre 20 secondes)'); text = await ocr(await imageCanvas(file), p => setStatus('Lecture de la photo… ' + p + ' %')); }
    const res = parseSlip(text);
    if (res.net == null) slipConfirm(res, 'Je n’ai pas trouvé la ligne « Net à payer ». Si c’est une photo, prends-la bien à plat et nette, ou saisis le montant.');
    else slipConfirm(res, '');
  } catch(e){
    slipConfirm(null, 'La lecture n’a pas marché (vérifie ta connexion la première fois). Tu peux saisir le montant.');
  }
}
fileEl.addEventListener('change', () => { const f = fileEl.files && fileEl.files[0]; fileEl.value = ''; if (f) readSlip(f); });

  if (act === 'bank-abo-add'){
    const x = BANK.items.find(y => y.i === +b.dataset.i); if (!x) return;

    x.noted = true; x.avec = cleanLabel(x.label); x.abo = id; x.nouvelAbo = false; x.pick = false;

  if (act === 'chip'){ document.getElementById('dn-' + b.dataset.cat).value = b.dataset.v; document.getElementById('da-' + b.dataset.cat).focus(); return; }

app.addEventListener('submit', e => {

/* ---------- mise à jour automatique (même quand l'appli est sur l'écran d'accueil) ---------- */
function busyNow(){ return S.view === 'wizard' || !!modalEl.innerHTML || inputFocused(); }
let checking = false;
function doReload(url){
  if (busyNow()){ pendingReload = url; return; }
  toast('Nouvelle version, mise à jour…');
  setTimeout(() => location.replace(url), 600);
}
async function checkUpdate(){
  if (pendingReload && !busyNow()){ const u = pendingReload; pendingReload = null; doReload(u); return; }
  if (checking || APP_VER === 'dev' || !navigator.onLine || location.protocol !== 'https:') return;
  checking = true;
  try {
    const r = await fetch('version.json?t=' + Date.now(), {cache: 'no-store'});
    const v = (await r.json()).v;
    let tried = null; try { tried = sessionStorage.getItem('budget-upd-tried'); } catch(e){}
    if (v && v !== APP_VER && tried !== v){
      try { sessionStorage.setItem('budget-upd-tried', v); } catch(e){}
      try { const regs = await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(g => g.update().catch(() => {}))); } catch(e){}
      doReload(location.pathname + '?v=' + encodeURIComponent(v));
    }
  } catch(e){}
  checking = false;
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });
window.addEventListener('online', checkUpdate);
document.addEventListener('focusout', () => setTimeout(() => { if (pendingReload && !busyNow()) checkUpdate(); }, 300));
setTimeout(checkUpdate, 1200);
setInterval(checkUpdate, 5 * 60 * 1000);

if ('serviceWorker' in navigator && location.protocol === 'https:'){
  let reloaded = false;
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !reloaded && !busyNow()){ reloaded = true; location.reload(); } });
  navigator.serviceWorker.register('sw.js', {scope: './', updateViaCache: 'none'}).then(r => r.update()).catch(() => {});
}
})();
